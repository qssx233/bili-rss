name: Update B站 RSS

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Write B站 cookie
        env:
          BILI_COOKIES: ${{ secrets.BILI_COOKIES }}
        run: |
          if [ -z "$BILI_COOKIES" ]; then
            echo "::error::Secret BILI_COOKIES 未设置"
            exit 1
          fi
          printf '%s' "$BILI_COOKIES" > "$RUNNER_TEMP/bili_cookies.json"

      - name: Generate feed
        run: |
          python scripts/bilibili_rss.py 34569411 \
            --name unixchad \
            --cookie "$RUNNER_TEMP/bili_cookies.json" \
            --output feed.xml \
            --count 30

      - name: Verify feed
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          text = open('feed.xml', encoding='utf-8').read()
          root = ET.fromstring(text)
          items = root.findall('.//item')
          print('items:', len(items))
          print('iframe:', text.count('iframe'))
          if len(items) == 0:
              raise SystemExit('feed 没有条目')
          if text.count('iframe') != 0:
              raise SystemExit('feed 含 iframe，中止发布')
          PY

      - name: Commit and push
        run: |
          git config user.name "bili-rss-bot"
          git config user.email "qssx@aliyun.com"
          git add feed.xml
          if git diff --cached --quiet; then
            echo "feed 无变化，跳过提交"
            exit 0
          fi
          git commit -m "Update feed $(date -u +%Y-%m-%d)"
          git push
